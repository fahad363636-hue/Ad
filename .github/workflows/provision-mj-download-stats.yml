name: Provision MJ download counters database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-mj-download-stats.yml'
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '6f5bb7350fd0caa7cbe960ec282c6459' }}
    steps:
      - uses: actions/checkout@v4
      - name: Provision D1 and database table
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          if not token: raise RuntimeError('Cloudflare token unavailable')
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def call(path='',method='GET',body=None):
              req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
              if not data.get('success'): raise RuntimeError(str(data.get('errors')))
              return data.get('result')
          try:
              databases=call('?per_page=100')
              record=next((d for d in databases if d.get('name')=='mjrepo-downloads'),None)
              if record is None:
                  record=call(method='POST',body={'name':'mjrepo-downloads'})
              dbid=record['uuid']
              print('D1_DATABASE_ID='+dbid)
              sql='CREATE TABLE IF NOT EXISTS downloads (package TEXT PRIMARY KEY, count INTEGER NOT NULL DEFAULT 0, last_download TEXT);'
              call('/'+dbid+'/query',method='POST',body={'sql':sql})
              print('D1_READY=true')
          with open('/tmp/mj-d1-id','w') as f: f.write(dbid)
          except urllib.error.HTTPError as exc:
              print('Cloudflare D1 API error HTTP',exc.code,exc.read().decode()[:1100])
              raise
          PY
      - name: Save D1 binding ID and trigger automatic deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/mj-d1-id
          python3 - <<'PY'
          import json
          from pathlib import Path
          dbid=Path('/tmp/mj-d1-id').read_text().strip()
          assert len(dbid)==36
          Path('.github/mj-download-db.json').write_text(json.dumps({'database_id':dbid,'database_name':'mjrepo-downloads','binding':'DOWNLOAD_DB'},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/mj-download-db.json
          if ! git diff --cached --quiet; then
            git commit -m 'Connect MJ download statistics D1 database'
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
            done
          fi
