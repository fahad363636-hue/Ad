name: Deploy MJ Repo to Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'mj/**'
      - '.github/workflows/deploy-mj-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mjrepo-cloudflare-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve existing Cloudflare account
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing existing CLOUDFLARE_API_TOKEN secret in this GitHub repository. Add the token already used for MJ Repo."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Looking up Cloudflare account ID for existing Pages project mjrepo"
            result=$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=100')
            CF_ACCOUNT_ID=$(printf '%s' "$result" | python3 -c 'import json,sys; d=json.load(sys.stdin); a=d.get("result") or []; assert d.get("success") and len(a)==1, "Cannot uniquely detect account. Add CLOUDFLARE_ACCOUNT_ID secret."; print(a[0]["id"])')
          fi
          echo "::add-mask::$CF_ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CF_ACCOUNT_ID" >> "$GITHUB_ENV"
      - name: Deploy to existing mjrepo Cloudflare Pages project
        run: npx --yes wrangler@4 pages deploy mj --project-name=mjrepo --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
