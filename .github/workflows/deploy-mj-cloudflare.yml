name: Deploy MJ Repo to Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'mj/**'
      - '.github/workflows/deploy-mj-cloudflare.yml'
      - '.github/mj-download-db.json'
      - '.github/workflows/provision-mj-download-stats.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mjrepo-cloudflare-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore legacy gallery before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -s mj/showcase-v3.zip
          mkdir -p dist
          cp -a mj/. dist/
          unzip -oq mj/showcase-v3.zip -d dist/
          for f in Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release index.html CydiaIcon.png CydiaIcon@2x.png CydiaIcon@3x.png icon.png _worker.js; do cp "mj/$f" "dist/$f"; done
          mkdir -p dist/debs
          cp -a mj/debs/. dist/debs/
          for p in magiccam photozero settingshide deepclean; do
            mkdir -p "dist/depictions/$p"
            cp -a "mj/depictions/$p/." "dist/depictions/$p/"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist/depictions')
          support_md = (
              "**🇸🇦 العربية**\n\n"
              "**هل تحتاج إلى مساعدة أو لديك استفسار؟**\n\n"
              "لا تتردد في التواصل مع المطور مباشرة للحصول على الدعم الفني أو المساعدة في التثبيت والتفعيل.\n\n"
              "**🇬🇧 English**\n\n"
              "**Need help or have a question?**\n\n"
              "Feel free to contact the developer directly for technical support or assistance with installation and activation.\n\n"
              "**📧 البريد الإلكتروني | Email:** [fahad363636@gmail.com](mailto:fahad363636@gmail.com)\n\n"
              "**💬 تيليجرام | Telegram:** [@mohmo10s](https://t.me/mohmo10s)"
          )
          support_html = """<section id="mj-developer-support" style="max-width:900px;margin:24px auto;padding:22px;border:1px solid rgba(128,145,185,.35);border-radius:18px;background:rgba(115,130,175,.10);color:inherit;font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
          <h2 style="margin:0 0 14px;font-size:22px">📞 الدعم الفني | Technical Support</h2>
          <div lang="ar" dir="rtl"><strong>🇸🇦 العربية</strong><p><strong>هل تحتاج إلى مساعدة أو لديك استفسار؟</strong></p><p>لا تتردد في التواصل مع المطور مباشرة للحصول على الدعم الفني أو المساعدة في التثبيت والتفعيل.</p></div>
          <div lang="en"><strong>🇬🇧 English</strong><p><strong>Need help or have a question?</strong></p><p>Feel free to contact the developer directly for technical support or assistance with installation and activation.</p></div>
          <p><strong>📧 البريد الإلكتروني | Email:</strong> <a href="mailto:fahad363636@gmail.com" style="color:#46b3ee;overflow-wrap:anywhere">fahad363636@gmail.com</a></p>
          <p><strong>💬 تيليجرام | Telegram:</strong> <a href="https://t.me/mohmo10s" style="color:#46b3ee;overflow-wrap:anywhere">@mohmo10s</a></p>
          </section>"""
          def with_support_html(s):
              if 'id="mj-developer-support"' in s:
                  return s
              closing = '</main>' if '</main>' in s else '</body>'
              assert closing in s, "Missing HTML closing tag in depiction"
              return s.replace(closing, support_html + closing, 1)
          updated_html = 0
          updated_json = 0
          for html_path in sorted(root.glob('*/index.html')) + [Path('dist/index.html')]:
              original = html_path.read_text(encoding='utf-8')
              modified = with_support_html(original)
              if modified != original:
                  html_path.write_text(modified, encoding='utf-8')
                  updated_html += 1
          for json_path in sorted(root.glob('*/depiction.json')):
              depiction = json.loads(json_path.read_text(encoding='utf-8'))
              if depiction.get('tabs'):
                  views = depiction['tabs'][0]['views']
              else:
                  views = depiction['views']
              if not any(v.get('class') == 'DepictionMarkdownView' and '@mohmo10s' in v.get('markdown', '') for v in views):
                  views.extend([
                      {'class': 'DepictionHeaderView', 'title': '📞 الدعم الفني | Technical Support'},
                      {'class': 'DepictionMarkdownView', 'markdown': support_md}
                  ])
                  json_path.write_text(json.dumps(depiction, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  updated_json += 1
          assert updated_html >= 14, 'Expected support contact in homepage and depictions'
          assert updated_json >= 13, 'Expected support contact in Sileo depictions'
          print(f'CONTACT_SECTION_ADDED: {updated_html} HTML pages, {updated_json} Sileo depictions')
          for name in 'whatsapp messenger tiktok facebook instagram snapchat youtube camvortex fakegps guardian'.split():
              folder=root/name
              assert (folder/'screenshot-1.jpg').stat().st_size>1000, name+' screenshot missing'
              desc=json.loads((folder/'depiction.json').read_text())
              tabs=desc.get('tabs',[])
              views=[v for t in tabs for v in t.get('views',[])] if tabs else desc.get('views',[])
              assert any(v.get('class')=='DepictionImageView' for v in views), name+' gallery missing'
              assert (folder/'index.html').stat().st_size>1500, name+' description missing'
          for name in ('magiccam','photozero','settingshide','deepclean'):
              assert (root/name/'depiction.json').exists(), name
          m=json.loads((root/'magiccam'/'depiction.json').read_text())
          mv=[v for t in m.get('tabs',[]) for v in t.get('views',[])]
          assert sum(v.get('class')=='DepictionImageView' for v in mv)==5, 'MagicCam screenshots missing'
          for i in range(1,6):
              assert (root/'magiccam'/('screen-'+str(i)+'.png')).stat().st_size>1000
          assert (root/'deepclean'/'before.jpg').stat().st_size>1000 and (root/'deepclean'/'after.jpg').stat().st_size>1000
          assert b'Package: com.mohamedjj.deepclean' in Path('dist/Packages').read_bytes()
          assert b'Package: com.mohamedjj.novacam' in Path('dist/Packages').read_bytes()
          print('RESTORED legacy pages and galleries, retained MagicCam')
          PY
      - name: Deploy using existing Cloudflare token
        id: publish
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '6f5bb7350fd0caa7cbe960ec282c6459' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ]; then
            echo "missing_token" > /tmp/mj-deploy-reason
            echo "::error::CLOUDFLARE_API_TOKEN is not available in repository Actions secrets."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            response=$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=100") || {
              echo "account_lookup_failed" > /tmp/mj-deploy-reason
              exit 1
            }
            CF_ACCOUNT_ID=$(printf '%s' "$response" | python3 -c 'import sys,json; r=json.load(sys.stdin); a=r.get("result") or []; assert r.get("success") and len(a)==1, "Expected one accessible Cloudflare account"; print(a[0]["id"])') || {
              echo "account_lookup_ambiguous" > /tmp/mj-deploy-reason
              exit 1
            }
          fi
          echo "::add-mask::$CF_ACCOUNT_ID"
          export CLOUDFLARE_API_TOKEN="$CF_API_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          if [ -f .github/mj-download-db.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          database=json.loads(Path('.github/mj-download-db.json').read_text())
          assert database['binding']=='DOWNLOAD_DB'
          cfg={'name':'mjrepo','pages_build_output_dir':'./dist','compatibility_date':'2026-11-15','d1_databases':[{'binding':'DOWNLOAD_DB','database_name':database['database_name'],'database_id':database['database_id']}]}
          Path('wrangler.json').write_text(json.dumps(cfg,indent=2))
          PY
          fi
          npx --yes wrangler@4 pages deploy dist --project-name=mjrepo --branch=main --commit-dirty=true || {
            echo "wrangler_deploy_failed" > /tmp/mj-deploy-reason
            exit 1
          }
          echo "success" > /tmp/mj-deploy-reason
      - name: Verify live download statistics and preserved depictions
        if: steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          base='https://mjrepo.pages.dev'
          def fetch(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'MJRepo-verification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  return resp.status,resp.read()
          last=None
          for i in range(6):
              try:
                  for private_path in ('/api/downloads','/downloads/','/downloads/index.html'):
                      try:
                          fetch(private_path)
                      except urllib.error.HTTPError as error:
                          assert error.code==401, f'{private_path} should require login, returned {error.code}'
                      else:
                          raise AssertionError(f'{private_path} publicly accessible')
                  for public_path in ('/','/Packages','/depictions/whatsapp/screenshot-1.jpg','/depictions/magiccam/screen-1.png'):
                      code,data=fetch(public_path)
                      assert code==200 and len(data)>1000, public_path+' inaccessible'
                  code,home=fetch('/')
                  assert b'Download Statistics' not in home, 'Public stats button still visible'
                  print('STATS_PRIVATE_AND_REPO_PUBLIC_OK')
                  break
              except Exception as exc:
                  last=exc
                  if i==5: raise
                  time.sleep(6)
          PY
      - name: Report publish result
        if: always()
        run: echo "Cloudflare step outcome recorded" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail workflow if deployment failed
        if: steps.publish.outcome != 'success'
        run: exit 1
